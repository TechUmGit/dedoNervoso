<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dedo Nervoso - O Jogo</title>
    
    <!-- Configurações básicas para PWA -->
    <meta name="theme-color" content="#FF4757">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --cor-p1: #FF4757;
            --cor-p2: #1E90FF;
            --cor-fundo: #1E222B;
            --cor-card: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Helvetica Neue', sans-serif;
            background-color: var(--cor-fundo);
            color: #333;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Tela de Início / Configuração */
        #tela-inicio {
            background-color: var(--cor-card);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 450px;
            z-index: 10;
        }

        h1 {
            color: #FF4757;
            margin-bottom: 5px;
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitulo {
            color: #FFA500;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .input-grupo {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 3px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            user-select: text; /* Permite seleção e digitação normal do teclado */
            -webkit-user-select: text;
        }

        input[id="p1-nome"] { border-color: var(--cor-p1); }
        input[id="p2-nome"] { border-color: var(--cor-p2); }

        #btn-comecar {
            background-color: #2ED573;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #26af5f;
            margin-top: 10px;
            width: 100%;
        }

        #btn-comecar:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #26af5f;
        }

        /* Tela de Jogo */
        #tela-jogo {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            grid-template-columns: 150px 1fr 150px;
        }

        /* Botões de Velocidade nas Extremidades */
        .btn-buzzer {
            height: 100%;
            border: none;
            color: white;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            transition: background-color 0.1s;
        }

        #buzzer-p1 {
            background-color: var(--cor-p1);
            box-shadow: inset -10px 0 rgba(0,0,0,0.2);
        }

        #buzzer-p2 {
            background-color: var(--cor-p2);
            box-shadow: inset 10px 0 rgba(0,0,0,0.2);
            writing-mode: vertical-rl;
            transform: rotate(0deg);
        }

        .btn-buzzer:disabled {
            background-color: #747d8c !important;
            opacity: 0.4;
        }

        /* Painel Central */
        .painel-central {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background-color: #f1f2f6;
            height: 100%;
            position: relative;
        }

        /* Placar superior */
        .placar {
            display: flex;
            justify-content: space-between;
            background: #fff;
            padding: 12px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 18px;
        }

        .placar-p1 { color: var(--cor-p1); font-weight: bold; }
        .placar-p2 { color: var(--cor-p2); font-weight: bold; }

        /* Área da Pergunta */
        .area-pergunta {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            margin: 15px 0;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #texto-pergunta {
            font-size: 24px;
            color: #2f3542;
            line-height: 1.4;
            font-weight: bold;
        }

        #status-turno {
            font-size: 16px;
            margin-top: 15px;
            font-weight: bold;
            color: #ffa500;
            text-transform: uppercase;
        }

        /* Alternativas de Resposta */
        .area-alternativas {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn-alternativa {
            background: white;
            border: 3px solid #ced6e0;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: all 0.1s;
            width: 100%;
        }

        .btn-alternativa:disabled {
            background: #e4e7eb;
            color: #a4b0be;
            cursor: not-allowed;
        }

        /* Cores de Feedback nos botões centrais */
        .vez-p1 { border-color: var(--cor-p1) !important; background-color: #ffeef0; }
        .vez-p2 { border-color: var(--cor-p2) !important; background-color: #eef7ff; }

        /* Tela de Fim de Jogo */
        #tela-fim {
            display: none;
            background-color: var(--cor-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 450px;
            z-index: 10;
        }

        #vencedor-texto {
            font-size: 28px;
            color: #2ed573;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Adaptação para telas menores de celular */
        @media (max-width: 600px) {
            #tela-jogo {
                grid-template-columns: 80px 1fr 80px;
            }
            .btn-buzzer {
                font-size: 20px;
            }
            #texto-pergunta {
                font-size: 19px;
            }
            .btn-alternativa {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. TELA DE INÍCIO -->
    <div id="tela-inicio">
        <h1>DEDO NERVOSO</h1>
        <div class="subtitulo">⚡ O Desafio do Clique Rápido ⚡</div>
        <div class="input-grupo">
            <label for="p1-nome">Jogador 1 (Vermelho):</label>
            <input type="text" id="p1-nome" value="" placeholder="Digite o nome..." maxlength="12">
        </div>
        <div class="input-grupo">
            <label for="p2-nome">Jogador 2 (Azul):</label>
            <input type="text" id="p2-nome" value="" placeholder="Digite o nome..." maxlength="12">
        </div>
        <p style="margin: 15px 0; font-size: 14px; color: #666; font-weight: bold;">Quem cravar 15 pontos primeiro vence!</p>
        <button id="btn-comecar" onclick="iniciarJogo()">INICIAR CONFRONTO</button>
    </div>

    <!-- 2. TELA DE JOGO -->
    <div id="tela-jogo">
        <!-- Buzzer Jogador 1 (Esquerda) -->
        <button id="buzzer-p1" class="btn-buzzer" onmousedown="baterBuzzer(1)" ontouchstart="baterBuzzer(1)">BATI!</button>
        
        <!-- Painel Central com Pergunta e Opções -->
        <div class="painel-central">
            <div class="placar">
                <span id="placar-p1-txt" class="placar-p1">J1: 0/15</span>
                <span style="font-weight: bold; color: #a4b0be;">DUELO</span>
                <span id="placar-p2-txt" class="placar-p2">J2: 0/15</span>
            </div>

            <div class="area-pergunta">
                <div id="texto-pergunta">Carregando pergunta...</div>
                <div id="status-turno">PREPARE O DEDO E APERTE O SEU BOTÃO DIRETOR!</div>
            </div>

            <div class="area-alternativas">
                <button id="alt-0" class="btn-alternativa" onclick="escolherResposta(0)" disabled>A) Opção A</button>
                <button id="alt-1" class="btn-alternativa" onclick="escolherResposta(1)" disabled>B) Opção B</button>
                <button id="alt-2" class="btn-alternativa" onclick="escolherResposta(2)" disabled>C) Opção C</button>
            </div>
        </div>

        <!-- Buzzer Jogador 2 (Direita) -->
        <button id="buzzer-p2" class="btn-buzzer" onmousedown="baterBuzzer(2)" ontouchstart="baterBuzzer(2)">BATI!</button>
    </div>

    <!-- 3. TELA DE FIM DE JOGO -->
    <div id="tela-fim">
        <h1>Fim de Jogo!</h1>
        <div id="vencedor-texto">Jogador X Ganhou!</div>
        <button id="btn-comecar" onclick="reiniciarJogo()">Nova Partida</button>
    </div>

            {q: "Como chamamos um polígono que possui exatamente 8 lados?", a: ["Hexágono", "Heptágono", "Octógono"], c: 2},
            {q: "Qual destas aves não consegue voar de jeito nenhum?", a: ["Avestruz", "Águia", "Falcão"], c: 0},
            {q: "Que monumento histórico foi construído na China para proteger contra invasões?", a: ["Coliseu", "Grande Muralha", "Pirâmides"], c: 1},
            {q: "Qual é o metal mais abundante encontrado na crosta do planeta Terra?", a: ["Ouro", "Alumínio", "Cobre"], c: 1},
            {q: "Qual o resultado de 9 x 9?", a: ["72", "81", "90"], c: 1},
            {q: "Qual fenômeno natural é medido pela Escala Richter?", a: ["Furacão", "Terremoto", "Erupção Vulcânica"], c: 1},
            {q: "Qual órgão do corpo limpa o nosso sangue eliminando as impurezas pela urina?", a: ["Fígado", "Coração", "Rins"], c: 2}
        ];

        // --- VARIÁVEIS DE ESTADO DO JOGO ---
        let perguntasEmbaralhadas = [];
        let perguntaAtualIdx = 0;
        let pontosP1 = 0;
        let pontosP2 = 0;
        let nomeP1 = "Jogador 1";
        let nomeP2 = "Jogador 2";
        
        let quemApertouBuzzer = null; 
        let opcoesBloqueadas = []; 
        let modoRecuperacao = false; 

        // --- FUNÇÕES DE CONTROLE ---

        function embaralharPerguntas() {
            perguntasEmbaralhadas = [...bancoPerguntas];
            for (let i = perguntasEmbaralhadas.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [perguntasEmbaralhadas[i], perguntasEmbaralhadas[j]] = [perguntasEmbaralhadas[j], perguntasEmbaralhadas[i]];
            }
        }

        function iniciarJogo() {
            // Se o campo estiver em branco, adota um nome genérico automaticamente para não quebrar a tela
            nomeP1 = document.getElementById('p1-nome').value.trim() || "Jogador Vermelho";
            nomeP2 = document.getElementById('p2-nome').value.trim() || "Jogador Azul";

            document.getElementById('tela-inicio').style.display = 'none';
            document.getElementById('tela-fim').style.display = 'none';
            document.getElementById('tela-jogo').style.display = 'grid';

            pontosP1 = 0;
            pontosP2 = 0;
            perguntaAtualIdx = 0;
            embaralharPerguntas();
            atualizarPlacar();
            carregarPergunta();
        }

        function atualizarPlacar() {
            document.getElementById('placar-p1-txt').innerText = `${nomeP1}: ${pontosP1}/15`;
            document.getElementById('placar-p2-txt').innerText = `${nomeP2}: ${pontosP2}/15`;
        }

        function carregarPergunta() {
            quemApertouBuzzer = null;
            opcoesBloqueadas = [];
            modoRecuperacao = false;

            document.getElementById('buzzer-p1').disabled = false;
            document.getElementById('buzzer-p2').disabled = false;
            document.getElementById('status-turno').innerText = "PREPARE O DEDO E APERTE O SEU BOTÃO DIRETOR!";
            document.getElementById('status-turno').style.color = "#ffa500";

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`alt-${i}`);
                btn.disabled = true;
                btn.classList.remove('vez-p1', 'vez-p2');
            }

            let dadosPergunta = perguntasEmbaralhadas[perguntaAtualIdx];
            document.getElementById('texto-pergunta').innerText = dadosPergunta.q;
            
            for (let i = 0; i < 3; i++) {
                document.getElementById(`alt-${i}`).innerText = `${String.fromCharCode(65 + i)}) ${dadosPergunta.a[i]}`;
            }
        }

        function baterBuzzer(jogador) {
            if (quemApertouBuzzer !== null) return; 

            quemApertouBuzzer = jogador;
            
            document.getElementById('buzzer-p1').disabled = true;
            document.getElementById('buzzer-p2').disabled = true;

            let nomeVez = (jogador === 1) ? nomeP1 : nomeP2;
            let statusTxt = document.getElementById('status-turno');
            statusTxt.innerText = `VEZ DE: ${nomeVez.toUpperCase()}! Escolha agora!`;
            statusTxt.style.color = (jogador === 1) ? 'var(--cor-p1)' : 'var(--cor-p2)';

            for (let i = 0; i < 3; i++) {
                const btn = document.getElementById(`alt-${i}`);
                if (!opcoesBloqueadas.includes(i)) {
                    btn.disabled = false;
                    btn.classList.add(jogador === 1 ? 'vez-p1' : 'vez-p2');
                }
            }
        }

        function escolherResposta(idxAlternativa) {
            let dadosPergunta = perguntasEmbaralhadas[perguntaAtualIdx];
            
            if (idxAlternativa === dadosPergunta.c) {
                // ACERTOU
                if (quemApertouBuzzer === 1) pontosP1++;
                else pontosP2++;

                atualizarPlacar();
                verificarFimDeJogo();
            } else {
                // ERROU
                opcoesBloqueadas.push(idxAlternativa);
                
                const btnErrado = document.getElementById(`alt-${idxAlternativa}`);
                btnErrado.disabled = true;
                btnErrado.classList.remove('vez-p1', 'vez-p2');

                if (!modoRecuperacao) {
                    modoRecuperacao = true;
                    let proximoJogador = (quemApertouBuzzer === 1) ? 2 : 1;
                    quemApertouBuzzer = proximoJogador;

                    let nomeVez = (proximoJogador === 1) ? nomeP1 : nomeP2;
                    let statusTxt = document.getElementById('status-turno');
                    statusTxt.innerText = `ERROU! CHANCE DE RECUPERAÇÃO PARA: ${nomeVez.toUpperCase()}!`;
                    statusTxt.style.color = (proximoJogador === 1) ? 'var(--cor-p1)' : 'var(--cor-p2)';

                    for (let i = 0; i < 3; i++) {
                        const btn = document.getElementById(`alt-${i}`);
                        if (!opcoesBloqueadas.includes(i)) {
                            btn.disabled = false;
                            btn.classList.add(proximoJogador === 1 ? 'vez-p1' : 'vez-p2');
                        }
                    }
                } else {
                    document.getElementById('status-turno').innerText = "Ambos falharam! Trocando de pergunta...";
                    document.getElementById('status-turno').style.color = "#747d8c";
                    setTimeout(proximaPergunta, 2000);
                }
            }
        }

        function verificarFimDeJogo() {
            if (pontosP1 >= 15 || pontosP2 >= 15) {
                document.getElementById('tela-jogo').style.display = 'none';
                document.getElementById('tela-fim').style.display = 'block';
                
                let vencedor = (pontosP1 >= 15) ? nomeP1 : nomeP2;
                document.getElementById('vencedor-texto').innerText = `💥 ${vencedor} dominou o Dedo Nervoso! 💥`;
                document.getElementById('vencedor-texto').style.color = (pontosP1 >= 15) ? 'var(--cor-p1)' : 'var(--cor-p2)';
            } else {
                setTimeout(proximaPergunta, 1500);
            }
        }

        function proximaPergunta() {
            perguntaAtualIdx++;
            if (perguntaAtualIdx >= perguntasEmbaralhadas.length) {
                perguntaAtualIdx = 0;
                embaralharPerguntas();
            }
            carregarPergunta();
        }

        function reiniciarJogo() {
            document.getElementById('tela-fim').style.display = 'none';
            document.getElementById('tela-inicio').style.display = 'block';
        }

        // Previne menus de clique longo em telas touch
        window.oncontextmenu = function(event) {
             event.preventDefault();
             event.stopPropagation();
             return false;
        };
    </script>
</body>
</html>
